name: Release Charts

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # See https://github.com/helm/chart-releaser-action/issues/6
      # - name: Install Helm
      #   run: |
      #     curl -fsSLo get_helm.sh https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3
      #     chmod 700 get_helm.sh
      #     ./get_helm.sh

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 3.19.0

      - name: Add dependency chart repos
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo add incubator https://charts.helm.sh/incubator

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Release tag
        id: tag
        if: contains(steps.cr.outputs.changed_charts, 'cloudflare-exporter')
        run: |
          VERSION=$(grep '^version:' charts/cloudflare-exporter/Chart.yaml | awk '{print $2}')
          echo "tag=cloudflare-exporter-${VERSION}" >> "$GITHUB_OUTPUT"

  # The tag chart-releaser pushes does not trigger docker-release.yaml, so
  # publish the image for the new release from here.
  images:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-release.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

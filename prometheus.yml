global:
  scrape_interval: 60s  # Scrape every 60 seconds
  evaluation_interval: 60s
  external_labels:
    monitor: 'cloudflare-exporter-monitor'

scrape_configs:
  - job_name: 'cloudflare-exporter'
    static_configs:
      - targets: ['cloudflare-exporter:8080']
        labels:
          service: 'cloudflare'
    scrape_interval: 60s
    scrape_timeout: 30s
